name: Refresh Baileys lockfile

on:
  push:
    branches:
      - chore/update-baileys-056

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: chore/update-baileys-056
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Install exact locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore(deps): regenerate lockfile for Baileys 0.5.6"
            git push origin HEAD:chore/update-baileys-056
          fi
